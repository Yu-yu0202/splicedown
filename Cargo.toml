[package]
name = "splicedown-rs"
version = "0.1.0"
edition = "2024"
description = "A fast, modern bundler written in Rust."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Yu-yu0202/splicedown"
keywords = ["bundler", "build-tool", "rust"]
categories = ["development-tools"]

[dependencies]
anstyle = "1.0.14"
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
tokio = { version = "1.53.1", features = ["tracing", "macros", "rt"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[[bin]]
name = "splicedown"
path = "src/main.rs"
